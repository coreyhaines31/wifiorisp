name: Idea
description: Suggest a feature or a better way to explain something.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or question you had, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
