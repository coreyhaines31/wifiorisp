name: WiFiOrISP
options:
  bundleIdPrefix: app.wifiorisp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  WiFiOrISPCore:
    path: Packages/WiFiOrISPCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  WiFiOrISP:
    type: application
    platform: macOS
    sources:
      - WiFiOrISP
    dependencies:
      - package: WiFiOrISPCore
      - package: Sparkle
      # The `wifiorisp` command; the Homebrew cask links it onto the PATH.
      - target: WiFiOrISPCLI
        copy:
          destination: executables
        codeSignOnCopy: true
    entitlements:
      path: WiFiOrISP/WiFiOrISP.entitlements
      properties:
        com.apple.security.personal-information.location: true
    info:
      path: WiFiOrISP/Info.plist
      properties:
        CFBundleDisplayName: WiFi or ISP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        NSLocationUsageDescription: macOS only shows apps the Wi-Fi network name (and which access point you're on) with Location access. WiFi or ISP uses it to label your history by network and to spot roaming. It never reads or stores where you are.
        NSLocationWhenInUseUsageDescription: macOS only shows apps the Wi-Fi network name (and which access point you're on) with Location access. WiFi or ISP uses it to label your history by network and to spot roaming. It never reads or stores where you are.
        NSLocalNetworkUsageDescription: WiFi or ISP times a round trip to your router to tell whether a slowdown is your Wi-Fi or your ISP. It doesn't look for or connect to any other devices.
        SUFeedURL: https://github.com/coreyhaines31/wifiorisp/releases/latest/download/appcast.xml
        SUPublicEDKey: 5MTMTktA0NUipG5n3iJy+27VbXN9uKgO2BbCgK8yUKU=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: WiFi or ISP
        PRODUCT_MODULE_NAME: WiFiOrISP
        PRODUCT_BUNDLE_IDENTIFIER: app.wifiorisp.WiFiOrISP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # macOS ties Location access to the bundle ID and signature. A Debug build signed
        # differently under the release ID takes over that grant, and the installed app
        # loses the network name (#42). Debug builds get their own ID and permission.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.wifiorisp.WiFiOrISP.dev
  WiFiOrISPCLI:
    type: tool
    platform: macOS
    sources: [WiFiOrISPCLI]
    dependencies:
      - package: WiFiOrISPCore
    settings:
      base:
        PRODUCT_NAME: wifiorisp
        PRODUCT_BUNDLE_IDENTIFIER: app.wifiorisp.WiFiOrISP.CLI
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
schemes:
  WiFiOrISP:
    build:
      targets:
        WiFiOrISP: all
    test:
      targets:
        - package: WiFiOrISPCore/WiFiOrISPCoreTests
